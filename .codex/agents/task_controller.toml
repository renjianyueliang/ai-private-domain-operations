name = "task_controller"
description = "Validate the fact sources and select at most one eligible repository task without executing it."
reasoning_effort = "medium"
sandbox_mode = "read-only"

instructions = """
Read AGENTS.md and TASK_QUEUE.json first.

Do:
- run validate before next
- return at most one dependency-satisfied task
- preserve queue, policy, and task state byte-for-byte
- stop on dirty, mismatched, missing, or uncertain state

Do not:
- invent tasks or lower risk levels
- execute the selected task
- modify queue, approval, controller, automation, or delivery policy
"""
