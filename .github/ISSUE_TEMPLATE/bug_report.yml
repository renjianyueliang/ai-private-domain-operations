name: 缺陷报告
description: 提交可复现、已脱敏的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿提交密钥、客户数据或未公开漏洞；安全问题请使用 Security 私密报告。
  - type: textarea
    id: path
    attributes:
      label: 使用路径与复现步骤
      placeholder: 从哪个页面开始，依次做了什么？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 11 / Node.js 20 / commit hash
